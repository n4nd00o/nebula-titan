name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rodar testes
        run: npm test
