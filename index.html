<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Nebula Titan</title>
  <meta name="description" content="Nebula Titan — shoot 'em up retrô com chefes de partes destrutíveis em 4 mundos. Feito com JavaScript puro e HTML5 Canvas.">
  <meta name="theme-color" content="#05050d">
  <!-- PWA: instalável na tela inicial e jogável offline -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nebula Titan">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Nebula Titan — área do jogo"></canvas>
    <p id="error" class="error" hidden></p>
    <noscript><p class="error">Este jogo precisa de JavaScript habilitado.</p></noscript>
  </main>
  <!-- Aviso para girar o celular (só aparece em celular deitado, via CSS) -->
  <div id="rotate" class="rotate" aria-hidden="true">
    <div class="rotate-phone"></div>
    <p>Gire o celular<br>para jogar em pé</p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
